name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Swift Package for iOS Device
        run: |
          xcodebuild build \
            -package-path . \
            -scheme CubeControl \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=./build

      - name: Create Payload and Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build -name "CubeControl.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            # If executable was built directly without app bundle, package it
            mkdir -p Payload/CubeControl.app
            cp -r Resources/Info.plist Payload/CubeControl.app/
            BIN_PATH=$(find ./build -name "CubeControl" -type f -perm +111 | head -n 1)
            cp "$BIN_PATH" Payload/CubeControl.app/CubeControl
          else
            cp -r "$APP_PATH" Payload/
          fi
          zip -r CubeControl-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: CubeControl-iOS.ipa
          if-no-files-found: error
