name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build with xcodebuild
        run: |
          echo "Building Swift Package for iOS Device..."
          xcodebuild build \
            -scheme CubeControl \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "Packaging into IPA..."
          mkdir -p Payload/CubeControl.app
          cp Resources/Info.plist Payload/CubeControl.app/Info.plist
          
          BIN_PATH=$(find ./DerivedData -name "CubeControl" -type f -perm +111 | grep -v "\.dSYM" | head -n 1)
          echo "Found binary at: $BIN_PATH"
          cp "$BIN_PATH" Payload/CubeControl.app/CubeControl
          chmod +x Payload/CubeControl.app/CubeControl
          
          zip -r CubeControl-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: CubeControl-iOS.ipa
          if-no-files-found: error
